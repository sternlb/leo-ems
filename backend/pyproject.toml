[project]
name = "leo-ems"
version = "0.12.0"
description = "Energy Management System für Haushalt Basel Latour — läuft als Home-Assistant-Add-on"
requires-python = ">=3.13"  # myskoda>=2.0 verlangt 3.13; Add-on-Image = Python 3.13
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
# Geräte-Bibliotheken — werden erst gebraucht, wenn der jeweilige Adapter real angebunden wird
devices = [
    "pye3dc>=0.9",      # E3DC RSCP
    "myskoda>=2.0",     # Škoda Enyaq
    # Sungrow braucht keine Modbus-Bibliothek: der Adapter spricht das Protokoll
    # selbst (ein einziger Funktionscode). Siehe docs/systems/sungrow.md.
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",  # fastapi.testclient
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leo_ems*"]

[tool.setuptools.package-data]
leo_ems = ["web/*.html", "web/assets/*.png", "web/assets/*.jpg"]
