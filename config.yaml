name: Leo-EMS
version: "0.18.0"
slug: leo_ems
description: Energy Management System — koordiniert E3DC, go-e Wallbox, Enyaq und Vaillant WP
url: https://github.com/sternlb/leo-ems
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# Host-Netzwerk wie EVCC: RSCP (E3DC), go-e HTTP, Modbus (Sungrow), mDNS für die App
host_network: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Leo-EMS API + App-Endpunkt (Token-geschützt, docs/api-token-auth.md)
watchdog: http://[HOST]:8099/api/v1/health
# Web-Dashboard in der HA-Seitenleiste (wie EVCC): Supervisor proxied auf Port 8099,
# Auth übernimmt die HA-Anmeldung (Quelle ist immer der Ingress-Proxy 172.30.32.2)
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: Leo-EMS
map:
  - addon_config:rw
# Die Wärmepumpe hängt über die MyVaillant-Integration in Home Assistant und wird
# über die HA-REST-API gelesen/gestellt (devices/vaillant.py) — dafür braucht das
# Add-on den SUPERVISOR_TOKEN mit Core-API-Recht.
homeassistant_api: true
# Der Weg dorthin läuft über den Supervisor-Proxy (/core/api), also über die
# Supervisor-API. Ohne dieses Recht kam in v0.6.2 gar kein Token in der
# Add-on-Umgebung an und alle vier Zugangswege antworteten mit HTTP 401.
hassio_api: true
options:
  e3dc_host: ""
  e3dc_user: ""
  e3dc_password: ""
  e3dc_rscp_key: ""
  goe_host: ""
  skoda_user: ""
  skoda_password: ""
  # Garagen-Wechselrichter über den WiNet-S-Dongle. Leerer Host = Stub (0 W).
  # Die Unit-ID ist am Dongle NICHT ablesbar und musste abgetastet werden (= 1).
  sungrow_host: "192.168.178.51"
  sungrow_port: "502"
  sungrow_unit_id: "1"
  lat: "49.48"
  lon: "11.25"
  # Wärmepumpe: leere ww-Entity = WP nicht angebunden.
  # ha_base_url/ha_token nur für den Betrieb außerhalb des Add-ons setzen.
  vaillant_ww_entity: "water_heater.home_domestic_hot_water_0"
  vaillant_zone_entity: "climate.home_zone_zone_1_circuit_0_climate"
  ha_base_url: ""
  ha_token: ""
schema:
  e3dc_host: str?
  e3dc_user: str?
  e3dc_password: password?
  e3dc_rscp_key: password?
  goe_host: str?
  skoda_user: str?
  skoda_password: password?
  sungrow_host: str?
  sungrow_port: str?
  sungrow_unit_id: str?
  lat: str?
  lon: str?
  vaillant_ww_entity: str?
  vaillant_zone_entity: str?
  ha_base_url: str?
  ha_token: password?
