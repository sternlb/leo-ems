name: Leo-EMS
version: "0.3.1"
slug: leo_ems
description: Energy Management System — koordiniert E3DC, go-e Wallbox, Enyaq und (Stufe 2) Vaillant WP
url: https://github.com/sternlb/leo-ems
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# Host-Netzwerk wie EVCC: RSCP (E3DC), go-e HTTP, Modbus (Sungrow), mDNS für die App
host_network: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Leo-EMS API + App-Endpunkt (Token-geschützt, docs/api-token-auth.md)
watchdog: http://[HOST]:8099/api/v1/health
# Web-Dashboard in der HA-Seitenleiste (wie EVCC): Supervisor proxied auf Port 8099,
# Auth übernimmt die HA-Anmeldung (Quelle ist immer der Ingress-Proxy 172.30.32.2)
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: Leo-EMS
map:
  - addon_config:rw
options:
  e3dc_host: ""
  e3dc_user: ""
  e3dc_password: ""
  e3dc_rscp_key: ""
  goe_host: ""
  skoda_user: ""
  skoda_password: ""
  sungrow_host: ""
  lat: "49.48"
  lon: "11.25"
schema:
  e3dc_host: str?
  e3dc_user: str?
  e3dc_password: password?
  e3dc_rscp_key: password?
  goe_host: str?
  skoda_user: str?
  skoda_password: password?
  sungrow_host: str?
  lat: str?
  lon: str?
